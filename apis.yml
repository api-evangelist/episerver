aid: episerver
name: Episerver
description: >-
  Episerver is a digital experience platform (DXP) vendor that rebranded to Optimizely
  in 2021 after Episerver acquired Optimizely; the developer surface now ships under the
  Optimizely brand. The platform combines content management (CMS / Content Cloud), a
  headless Content Delivery and Content Management REST API, the Optimizely Graph
  (Content Graph) GraphQL API, Commerce (Configured Commerce and Commerce Connect),
  Feature Experimentation and Web Experimentation, the Optimizely Data Platform (ODP),
  the Content Marketing Platform (CMP), and Opti ID for unified OIDC identity. Developers
  integrate via first-party SDKs for JavaScript, React, Python, Java, C#/.NET, Ruby, PHP,
  Go and Swift, the EPiServer.CMS .NET libraries on NuGet, REST and GraphQL APIs, and
  webhooks. This profile was seeded as a portfolio lead and enriched by the API Evangelist
  pipeline from Optimizely's public developer documentation.
